<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FluexGL Test Zone</title>
    <style>
        a,
        abbr,
        acronym,
        address,
        applet,
        b,
        big,
        blockquote,
        body,
        button,
        caption,
        center,
        cite,
        code,
        dd,
        del,
        dfn,
        div,
        dl,
        dt,
        em,
        fieldset,
        font,
        footer,
        form,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        header,
        html,
        i,
        iframe,
        img,
        ins,
        kbd,
        label,
        legend,
        li,
        nav,
        object,
        ol,
        p,
        pre,
        q,
        s,
        samp,
        section,
        small,
        span,
        strike,
        strong,
        sub,
        sup,
        table,
        tbody,
        td,
        tfoot,
        th,
        thead,
        title,
        tr,
        tt,
        u,
        ul,
        var {
            margin: 0;
            padding: 0;
            border: 0;
            outline: 0;
            vertical-align: baseline;
            background: 0 0;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            outline: none;
        }

        .canvas-wrapper {
            width: 100vw;
            height: 100vh;

            canvas {
                position: absolute;
            }
        }
    </style>
</head>

<body>
    <button id="play-song">Play song</button>
    <div>
        <span>Pitch: </span>
        <input type="range" min=0" max="24" step="0.1" id="pitch">
    </div>
    <div>
        <span>Damping: </span>
        <input type="range" min="0" max="10" id="damping">
    </div>
    <div>
        <span>Room size: </span>
        <input type="range" step="0.1" min="0" max="10" id="room-size">
    </div>
    <div>
        <span>Mix: </span>
        <input type="range" min="0" max="1" step="0.01" id="mix">
    </div>
    <div>
        <span>Stereo spread ms: </span>
        <input type="range" min="0" max="100" id="stereo-spread-ms">
    </div>
    <!-- <div class="canvas-wrapper">
        <canvas class="scene-canvas"></canvas>
    </div> -->
</body>

</html>
